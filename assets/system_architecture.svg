<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Game Glitch Investigator system architecture</title>
  <desc id="desc">Data flow from user input through Streamlit or CLI, retrieval, agent diagnosis, guardrails, logging, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7efe5"/>
      <stop offset="55%" stop-color="#e8f3ee"/>
      <stop offset="100%" stop-color="#dce8f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#233142" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4f5f"/>
    </marker>
    <style>
      .title { font: 700 30px Georgia, serif; fill: #20313a; }
      .label { font: 700 17px Georgia, serif; fill: #20313a; }
      .text { font: 14px Helvetica, Arial, sans-serif; fill: #344851; }
      .box { fill: #fffaf3; stroke: #d08c60; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box2 { fill: #f6fbff; stroke: #5d8aa8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box3 { fill: #f7fff7; stroke: #6a9f72; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .arrow { stroke: #2f4f5f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d7f87; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="640" fill="url(#bg)"/>
  <text x="52" y="62" class="title">Game Glitch Investigator: Applied AI System</text>
  <text x="54" y="92" class="text">RAG + observable agent workflow + guardrails + reliability evaluation</text>

  <rect x="55" y="150" width="210" height="110" class="box"/>
  <text x="82" y="188" class="label">Human Input</text>
  <text x="82" y="216" class="text">Bug report or</text>
  <text x="82" y="238" class="text">sample game issue</text>

  <rect x="55" y="365" width="210" height="110" class="box"/>
  <text x="82" y="403" class="label">Game App</text>
  <text x="82" y="431" class="text">Streamlit guessing</text>
  <text x="82" y="453" class="text">game + debug info</text>

  <rect x="330" y="92" width="230" height="115" class="box2"/>
  <text x="360" y="132" class="label">Interface Layer</text>
  <text x="360" y="160" class="text">Streamlit panel or CLI</text>
  <text x="360" y="182" class="text">normalizes the report</text>

  <rect x="330" y="268" width="230" height="120" class="box3"/>
  <text x="360" y="309" class="label">Knowledge Retriever</text>
  <text x="360" y="337" class="text">Searches custom docs</text>
  <text x="360" y="359" class="text">for relevant evidence</text>

  <rect x="330" y="458" width="230" height="105" class="box2"/>
  <text x="360" y="497" class="label">Knowledge Base</text>
  <text x="360" y="525" class="text">Streamlit state, game</text>
  <text x="360" y="547" class="text">rules, guardrail notes</text>

  <rect x="635" y="150" width="240" height="130" class="box3"/>
  <text x="666" y="190" class="label">Investigator Agent</text>
  <text x="666" y="218" class="text">Validate, retrieve,</text>
  <text x="666" y="240" class="text">classify, plan, score</text>

  <rect x="635" y="350" width="240" height="125" class="box2"/>
  <text x="666" y="390" class="label">Guardrails + Logs</text>
  <text x="666" y="418" class="text">Reject vague reports</text>
  <text x="666" y="440" class="text">and save audit JSONL</text>

  <rect x="635" y="525" width="240" height="78" class="box"/>
  <text x="666" y="562" class="label">Evaluation Harness</text>
  <text x="666" y="586" class="text">Pass/fail reliability cases</text>

  <rect x="905" y="240" width="95" height="145" class="box"/>
  <text x="925" y="282" class="label">Output</text>
  <text x="925" y="312" class="text">Diagnosis</text>
  <text x="925" y="334" class="text">Patch plan</text>
  <text x="925" y="356" class="text">Confidence</text>

  <path d="M265 205 C295 190 306 165 330 150" class="arrow"/>
  <path d="M560 150 C590 160 607 180 635 205" class="arrow"/>
  <path d="M560 328 L635 215" class="arrow"/>
  <path d="M445 458 L445 388" class="arrow"/>
  <path d="M875 215 L905 300" class="arrow"/>
  <path d="M755 280 L755 350" class="arrow"/>
  <path d="M755 475 L755 525" class="dash"/>
  <path d="M265 420 C310 410 312 335 330 328" class="dash"/>
</svg>
